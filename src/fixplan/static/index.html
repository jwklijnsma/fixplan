<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8590c'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1db;--accent:#e8590c;--accent-ink:#fff;
  --crit:#c92a2a;--high:#e8590c;--med:#d9a400;--low:#1c7ed6;--info:#868e96;--code:#f1efe9;--ok:#2b8a3e;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9c9a92;--line:#2f2e2b;--code:#262522;--accent:#ff7a2f;
}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--sans);background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;letter-spacing:-.01em}
header h1 b{color:var(--accent)}
header .status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--info);display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--crit)}
main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 57px)}
aside{border-right:1px solid var(--line);padding:16px;overflow:auto;background:var(--panel)}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 10px}
.job{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.job:hover{background:var(--bg)}
.job.active{border-color:var(--accent);background:var(--bg)}
.job .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .m{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
section.content{padding:26px 34px;max-width:1050px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.drop strong{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
label{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{font-family:var(--mono);font-size:13px;min-height:130px;resize:vertical}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;padding:0;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--crit);font-size:14px;margin-top:10px}
.plan h2{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
.summary{font-size:16px;color:var(--ink);margin:8px 0 14px;max-width:75ch}
.meta{font-size:13px;color:var(--muted)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sev::before{content:"";width:9px;height:9px;border-radius:2px;background:currentColor}
.critical{color:var(--crit)}.high{color:var(--high)}.medium{color:var(--med)}.low{color:var(--low)}.info{color:var(--info)}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.step .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);border:2px solid currentColor}
.step h3{margin:0 0 4px;font-size:17px}
.step .why{color:var(--muted);margin:4px 0 10px}
.step ol{margin:6px 0 10px;padding-left:20px}
.step ol li{margin:3px 0}
.k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
pre{background:var(--code);border-radius:9px;padding:12px 14px;overflow:auto;font:12.5px/1.5 var(--mono);margin:6px 0;position:relative}
pre .copy{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px}
.diff-add{color:var(--ok)}.diff-del{color:var(--crit)}.diff-hunk{color:var(--low)}
.risk{border-left:3px solid var(--med);padding:6px 12px;margin-top:10px;font-size:14px;background:color-mix(in srgb,var(--med) 8%,transparent);border-radius:0 6px 6px 0}
.files{font-family:var(--mono);font-size:12px;color:var(--muted)}
details{margin-top:8px}summary{cursor:pointer;color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
td code{font:12px var(--mono)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.tabs{display:flex;gap:4px;margin:20px 0 4px}
.tabs button{border-radius:8px 8px 0 0;border-bottom:0}
.tabs button.on{background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center}
.modal.show{display:grid}
.modal .card{width:min(420px,92vw)}
@media (max-width:820px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:220px}section.content{padding:18px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><b>fix</b>plan</h1>
  <span class="meta">upload anything, get a plan to fix it</span>
  <div class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
</header>
<main>
  <aside>
    <button class="primary" id="newBtn" style="width:100%;justify-content:center;margin-bottom:16px">+ New plan</button>
    <h2>Plans</h2>
    <div id="jobs"><div class="meta">No plans yet.</div></div>
  </aside>
  <section class="content" id="view"></section>
</main>

<div class="modal" id="tokenModal"><div class="card">
  <h3 style="margin-top:0">Token required</h3>
  <p class="meta">This server needs its access token (FIXPLAN_WEB_TOKEN).</p>
  <input type="password" id="tokenInput" placeholder="token" autocomplete="off">
  <div class="row"><button class="primary" id="tokenSave">Continue</button></div>
</div></div>

<template id="newTpl">
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:22px">What should be fixed?</h2>
    <p class="meta" style="margin:0 0 16px">Code, config, manifests, Dockerfiles, Terraform, pipelines, logs or a stack trace. Files, a whole folder, a ZIP/tar, or paste it below.</p>
    <div class="drop" id="drop">
      <div><strong>Drop files, a folder or an archive here</strong></div>
      <div style="margin:8px 0">or</div>
      <button type="button" id="pickFiles">Choose files</button>
      <button type="button" id="pickFolder">Choose a folder</button>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
    </div>
    <div class="chips" id="chips"></div>
    <div class="k" style="margin-top:18px">Or paste</div>
    <textarea id="paste" placeholder="Paste a log, error, Dockerfile, manifest, script…"></textarea>
    <div class="grid2" style="margin-top:8px">
      <div><label>File name for the paste (optional, helps detection)</label><input type="text" id="pasteName" placeholder="e.g. Dockerfile, deploy.yaml, app.log"></div>
      <div><label>Goal (optional)</label><input type="text" id="goal" placeholder="e.g. make it run on OpenShift; fix the crash at startup"></div>
    </div>
    <div class="row">
      <label>Language <select id="lang" style="width:auto"><option value="en">English</option><option value="nl">Nederlands</option></select></label>
      <label><input type="checkbox" id="noLlm"> rules only (no model, seconds)</label>
      <span style="flex:1"></span>
      <button class="primary" id="go">Make the plan</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</template>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
let token = "";
try { token = localStorage.getItem("fixplan-token") || ""; } catch {}
const m = location.hash.match(/token=([^&]+)/);
if (m) { token = decodeURIComponent(m[1]); try { localStorage.setItem("fixplan-token", token); } catch {} history.replaceState(null, "", location.pathname); }

let info = null, jobs = [], current = null, pending = [], pollTimer = null, maxMb = 50;

async function api(path, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (r.status === 401) { $("#tokenModal").classList.add("show"); throw new Error("token required"); }
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
$("#tokenSave").onclick = () => {
  token = $("#tokenInput").value.trim();
  try { localStorage.setItem("fixplan-token", token); } catch {}
  $("#tokenModal").classList.remove("show"); boot();
};

async function boot() {
  try {
    info = await api("/api/info"); maxMb = info.max_upload_mb;
    $("#dot").className = "dot " + (info.ollama_ok && info.model_ok ? "ok" : "bad");
    $("#status").textContent = info.ollama_ok ? (info.model_ok ? info.model : info.model + " not pulled") : "Ollama unreachable (rules only)";
    $("#status").title = info.ollama + (info.error ? "\n" + info.error : "");
    await refreshJobs();
    if (!current) showNew();
  } catch (e) { $("#status").textContent = e.message; }
}

async function refreshJobs() {
  jobs = await api("/api/jobs");
  const box = $("#jobs"); box.replaceChildren();
  if (!jobs.length) box.append(h("div", {class:"meta"}, "No plans yet."));
  for (const j of jobs) {
    const sub = j.state === "done" ? `${j.steps} steps · ${j.findings} findings` : j.state === "failed" ? "failed" : j.message;
    const el = h("div", {class:"job" + (current === j.id ? " active" : ""), onclick:() => openJob(j.id)},
      h("div", {class:"n", title:j.name}, j.title || j.name),
      h("div", {class:"m"}, new Date(j.created*1000).toLocaleString(), " · ", sub));
    if (j.state === "running" || j.state === "queued") el.append(h("div", {class:"bar"}, h("i", {style:`width:${Math.round(j.progress*100)}%`})));
    box.append(el);
  }
  const busy = jobs.some(j => j.state === "running" || j.state === "queued");
  clearTimeout(pollTimer);
  if (busy) pollTimer = setTimeout(async () => { await refreshJobs(); if (current) { const j = jobs.find(x => x.id === current); if (j) openJob(current, true); } }, 1500);
}

// ---------------------------------------------------------------- new plan
$("#newBtn").onclick = () => showNew();
function showNew() {
  current = null; pending = []; refreshJobs().catch(()=>{});
  const view = $("#view"); view.replaceChildren($("#newTpl").content.cloneNode(true));
  const drop = $("#drop");
  $("#lang").value = (info && info.language) || "en";
  if (info && !info.ollama_ok) $("#noLlm").checked = true;
  $("#pickFiles").onclick = () => $("#fileInput").click();
  $("#pickFolder").onclick = () => $("#folderInput").click();
  $("#fileInput").onchange = e => addFiles([...e.target.files].map(f => [f.name, f]));
  $("#folderInput").onchange = e => addFiles([...e.target.files].map(f => [f.webkitRelativePath || f.name, f]));
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = async e => {
    e.preventDefault(); drop.classList.remove("over");
    const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (items.length) { const out = []; for (const it of items) await walk(it, "", out); addFiles(out); }
    else addFiles([...e.dataTransfer.files].map(f => [f.name, f]));
  };
  $("#go").onclick = submit;
}
function walk(entry, prefix, out) {
  return new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push([prefix + f.name, f]); res(); }, () => res());
    else if (entry.isDirectory) {
      const r = entry.createReader(), all = [];
      const read = () => r.readEntries(async ents => {
        if (!ents.length) { for (const en of all) await walk(en, prefix + entry.name + "/", out); res(); }
        else { all.push(...ents); read(); }
      }, () => res());
      read();
    } else res();
  });
}
const SKIP = /(^|\/)(\.git|node_modules|\.venv|venv|__pycache__|\.terraform)(\/|$)/;
function addFiles(list) {
  for (const [name, f] of list) if (!SKIP.test(name) && !pending.some(p => p[0] === name)) pending.push([name, f]);
  renderChips();
}
function renderChips() {
  const box = $("#chips"); if (!box) return; box.replaceChildren();
  const total = pending.reduce((a,[,f]) => a + f.size, 0);
  pending.slice(0, 40).forEach(([name], i) => box.append(h("span", {class:"chip"}, name,
    h("button", {title:"remove", onclick:() => { pending.splice(i,1); renderChips(); }}, "×"))));
  if (pending.length > 40) box.append(h("span", {class:"chip"}, `+${pending.length-40} more`));
  if (pending.length) box.append(h("span", {class:"meta"}, `${pending.length} file(s), ${(total/1048576).toFixed(1)} MB`));
}
const b64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(f); });
async function submit() {
  const err = $("#err"); err.textContent = "";
  const text = $("#paste").value;
  if (!pending.length && !text.trim()) { err.textContent = "Add a file or paste something first."; return; }
  const total = pending.reduce((a,[,f]) => a + f.size, 0);
  if (total > maxMb * 1048576) { err.textContent = `That is ${(total/1048576).toFixed(0)} MB; the limit is ${maxMb} MB. Leave out build output or vendored code.`; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Uploading…";
  try {
    const files = [];
    for (const [name, f] of pending) files.push({name, data: await b64(f)});
    const job = await api("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({files, text, text_name: $("#pasteName").value.trim(), goal: $("#goal").value.trim(),
                            language: $("#lang").value, no_llm: $("#noLlm").checked})});
    current = job.id; await refreshJobs(); openJob(job.id);
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Make the plan"; }
}

// ---------------------------------------------------------------- plan view
async function openJob(id, quiet) {
  current = id;
  document.querySelectorAll(".job").forEach(el => el.classList.remove("active"));
  const j = await api(`/api/jobs/${id}`);
  if (quiet && j.state === "done" && $("#view").dataset.job === id && $("#view").dataset.state === "done") return;
  const view = $("#view"); view.dataset.job = id; view.dataset.state = j.state; view.replaceChildren();
  refreshJobs().catch(()=>{});
  if (j.state === "queued" || j.state === "running") {
    view.append(h("div", {class:"card"}, h("h2", {style:"margin-top:0"}, j.name),
      j.goal ? h("p", {class:"meta"}, "Goal: ", j.goal) : null,
      h("p", {}, j.message), h("div", {class:"bar", style:"height:8px"}, h("i", {style:`width:${Math.round(j.progress*100)}%`})),
      h("p", {class:"meta"}, "Big uploads take a while: every file goes past the model. You can leave this page.")));
    return;
  }
  if (j.state === "failed") {
    view.append(h("div", {class:"card"}, h("h2", {style:"margin-top:0"}, j.name), h("p", {class:"err"}, j.error),
      h("button", {onclick: () => del(id)}, "Delete")));
    return;
  }
  renderPlan(view, j);
}

function codeBlock(text, diff) {
  const pre = h("pre");
  if (diff) for (const ln of text.split("\n")) {
    const cls = ln.startsWith("+") && !ln.startsWith("+++") ? "diff-add" : ln.startsWith("-") && !ln.startsWith("---") ? "diff-del" : ln.startsWith("@@") ? "diff-hunk" : null;
    pre.append(cls ? h("span", {class:cls}, ln) : ln, "\n");
  } else pre.append(text);
  pre.append(h("button", {class:"copy", onclick:e => { navigator.clipboard.writeText(text); e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy", 1200); }}, "copy"));
  return pre;
}

function renderPlan(view, j) {
  const p = j.plan, byId = Object.fromEntries(p.findings.map(f => [f.id, f]));
  const counts = {};
  for (const f of p.findings) counts[f.severity] = (counts[f.severity] || 0) + 1;
  const sevs = ["critical","high","medium","low","info"].filter(s => counts[s]);
  const dl = name => h("a", {class:"btn", href:"#", onclick: async e => {
    e.preventDefault();
    const r = await fetch(`/api/jobs/${j.id}/${name}`, {headers: token ? {Authorization:"Bearer " + token} : {}});
    const blob = await r.blob(); const a = h("a", {href: URL.createObjectURL(blob), download: `fixplan-${name}`}); a.click();
  }}, "⬇ " + name);
  const head = h("div", {class:"plan"},
    h("h2", {}, p.title),
    h("div", {class:"meta"}, `${p.files.length} file(s) · ${p.generator === "llm" ? "model " + p.model : "rules only"} · ${p.seconds}s`, j.goal ? " · goal: " + j.goal : ""),
    p.summary ? h("p", {class:"summary"}, p.summary) : null,
    h("div", {class:"row"}, ...sevs.map(s => h("span", {class:"sev " + s}, `${counts[s]} ${s}`)),
      h("span", {style:"flex:1"}), dl("plan.md"), dl("plan.json"), dl("plan.sarif"),
      h("button", {onclick: async () => { const md = await (await fetch(`/api/jobs/${j.id}/plan.md`, {headers: token ? {Authorization:"Bearer " + token} : {}})).text(); navigator.clipboard.writeText(md); }}, "Copy Markdown"),
      h("button", {onclick: () => del(j.id)}, "Delete")));
  view.append(head);

  const tabs = h("div", {class:"tabs"});
  const body = h("div", {class:"card", style:"border-top-left-radius:0"});
  const show = which => { [...tabs.children].forEach(b => b.classList.toggle("on", b.dataset.t === which)); body.replaceChildren(...(which === "plan" ? planBody() : which === "findings" ? findingsBody() : filesBody())); };
  for (const [t, label] of [["plan", `Plan (${p.steps.length})`], ["findings", `Findings (${p.findings.length})`], ["files", `Files (${p.files.length})`]])
    tabs.append(h("button", {"data-t": t, onclick: () => show(t)}, label));
  view.append(tabs, body);
  show("plan");

  function planBody() {
    if (!p.steps.length) return [h("div", {class:"empty"}, "✅ Nothing to fix.")];
    const out = p.steps.map((s, i) => h("div", {class:"step"},
      h("div", {class:"num " + s.priority}, i + 1),
      h("div", {},
        h("h3", {}, s.title),
        h("div", {}, h("span", {class:"sev " + s.priority}, s.priority), s.effort ? h("span", {class:"meta"}, "  · " + s.effort) : null,
          s.files.length ? h("span", {class:"files"}, "  · " + s.files.join(", ")) : null),
        s.why ? h("p", {class:"why"}, s.why) : null,
        s.actions.length ? [h("div", {class:"k"}, "Do"), h("ol", {}, s.actions.map(a => h("li", {}, a)))] : null,
        s.commands.length ? [h("div", {class:"k"}, "Run"), codeBlock(s.commands.join("\n"))] : null,
        s.patch ? [h("div", {class:"k"}, "Change"), codeBlock(s.patch, /^(---|@@|diff |[+-])/m.test(s.patch))] : null,
        s.verify.length ? [h("div", {class:"k"}, "Check"), h("ul", {}, s.verify.map(v => h("li", {}, v)))] : null,
        s.risk ? h("div", {class:"risk"}, "⚠ ", s.risk) : null,
        s.findings.length ? h("details", {}, h("summary", {}, `Resolves ${s.findings.length} finding(s)`),
          h("ul", {}, s.findings.map(id => byId[id]).filter(Boolean).map(f => h("li", {}, h("code", {}, f.file + (f.line ? ":" + f.line : "")), " — ", f.message, h("span", {class:"meta"}, ` (${f.source}/${f.rule})`))))) : null)));
    if (p.notes.length) out.push(h("details", {}, h("summary", {}, `Notes (${p.notes.length})`), h("ul", {}, p.notes.map(n => h("li", {class:"meta"}, n)))));
    return out;
  }
  function findingsBody() {
    if (!p.findings.length) return [h("div", {class:"empty"}, "No findings.")];
    return [h("table", {}, h("tr", {}, h("th", {}, ""), h("th", {}, "Where"), h("th", {}, "Problem"), h("th", {}, "Source")),
      p.findings.map(f => h("tr", {}, h("td", {}, h("span", {class:"sev " + f.severity}, f.severity)),
        h("td", {}, h("code", {}, f.file + (f.line ? ":" + f.line : ""))),
        h("td", {}, f.message, f.suggestion ? h("div", {class:"meta"}, "→ " + f.suggestion) : null),
        h("td", {class:"meta"}, `${f.source}/${f.rule}`, f.confidence != null ? ` · ${Math.round(f.confidence*100)}%` : ""))))];
  }
  function filesBody() {
    return [h("table", {}, h("tr", {}, h("th", {}, "File"), h("th", {}, "Detected as"), h("th", {}, "Lines")),
      p.files.map(f => h("tr", {}, h("td", {}, h("code", {}, f.path)), h("td", {}, f.kind), h("td", {}, f.lines, f.truncated ? " (cut)" : ""))))];
  }
}
async function del(id) {
  if (!confirm("Delete this plan?")) return;
  await api(`/api/jobs/${id}`, {method:"DELETE"}); showNew();
}
boot();
</script>
