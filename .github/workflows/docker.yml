name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow: a tag pushed with GITHUB_TOKEN does not start
  # other workflows, so the release builds its image through this instead.
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        type: string
        required: true
      version:
        description: Release version X.Y.Z, tagged as X.Y.Z and X.Y
        type: string
        required: false
      dry_run:
        description: Build and test, push nothing
        type: boolean
        default: false

concurrency:
  group: docker-${{ inputs.ref || github.ref }}
  # Never cancel a publish half-way; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fixplan
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The commit actually checked out; github.sha is the caller's when this is called.
      - id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # 1. Build for amd64 only and load it, so the smoke test runs the real image.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fixplan:test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - CLI plan
        run: |
          set -euo pipefail
          docker run --rm fixplan:test --version
          cp -r examples/sample "$RUNNER_TEMP/sample"
          chmod -R a+rwX "$RUNNER_TEMP/sample"
          set +e
          docker run --rm -v "$RUNNER_TEMP/sample:/work" \
            fixplan:test plan /work --no-llm -o /work/.fixplan -f md,json,sarif
          rc=$?
          set -e
          echo "plan exit code: $rc"
          test "$rc" -le 1   # 0 = clean, 1 = findings; 2 = the tool failed
          python3 - "$RUNNER_TEMP/sample/.fixplan/plan.json" <<'EOF'
          import json, sys
          p = json.load(open(sys.argv[1]))
          sources = {f["source"] for f in p["findings"]}
          print(f"{len(p['steps'])} steps, {len(p['findings'])} findings, sources: {sorted(sources)}")
          assert p["steps"], "no plan steps"
          assert {"static", "hadolint"} <= sources, f"checks missing: {sorted(sources)}"
          missing = [n for n in p["notes"] if "not installed" in n or "failed" in n]
          assert not missing, f"linters missing or broken in the image: {missing}"
          EOF

      - name: Smoke test - web UI
        run: |
          set -euo pipefail
          docker run -d --name fixplan -p 127.0.0.1:8766:8766 \
            --health-interval=2s --health-start-period=2s \
            -e FIXPLAN_WEB_TOKEN=ci-token fixplan:test
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' fixplan)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' fixplan)" = healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8766/api/jobs)" = 401
          # the UI bundle is in the image and served
          curl -fsS http://127.0.0.1:8766/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:8766/app.js
          # the token link swaps the token for an HttpOnly cookie
          curl -s -D - -o /dev/null "http://127.0.0.1:8766/?token=ci-token" | grep -qi '^set-cookie: fixplan_token=.*HttpOnly'
          body=$(python3 -c "import json,base64;print(json.dumps({'files':[{'name':'Dockerfile','data':base64.b64encode(open('examples/sample/Dockerfile','rb').read()).decode()}],'no_llm':True}))")
          id=$(curl -fsS -H "Authorization: Bearer ci-token" -H "Content-Type: application/json" \
                 -d "$body" http://127.0.0.1:8766/api/jobs | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          for i in $(seq 30); do
            state=$(curl -fsS -H "Authorization: Bearer ci-token" "http://127.0.0.1:8766/api/jobs/$id" | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")
            [ "$state" = done ] && break
            sleep 1
          done
          test "$state" = done
          curl -fsS -H "Authorization: Bearer ci-token" "http://127.0.0.1:8766/api/jobs/$id/plan.md" | grep -q "## Plan"
          docker stop -t 15 fixplan
          test "$(docker inspect -f '{{.State.ExitCode}}' fixplan)" = 0

      - name: Container logs
        if: always()
        run: docker logs fixplan 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && !inputs.dry_run
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Multi-arch build (amd64 comes from the cache above); pushed except on PRs and dry runs.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            if [ "${{ inputs.dry_run }}" = true ]; then echo "### Dry run: built, not pushed"; else echo "### Published"; fi
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
