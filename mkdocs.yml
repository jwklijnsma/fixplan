# fixplan documentation, built with MkDocs Material.
#   pip install -r requirements-docs.txt
#   mkdocs serve            # preview on http://localhost:8000
#   mkdocs build --strict   # what CI runs
site_name: fixplan
site_description: Upload code, config or logs and get a step-by-step fix plan from a local Ollama model
site_url: https://jwklijnsma.github.io/fixplan/
repo_url: https://github.com/jwklijnsma/fixplan
repo_name: jwklijnsma/fixplan
edit_uri: edit/main/docs/
copyright: fixplan - no content leaves your network

nav:
  - Home: index.md
  - Install: install.md
  - Command line: usage.md
  - Web UI: web-ui.md
  - Deploy: deploy.md
  - Configuration: configuration.md
  - Rules and file types: rules.md

theme:
  name: material
  language: en
  icon:
    logo: material/clipboard-check-outline
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
