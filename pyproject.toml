[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fixplan"
dynamic = ["version"]
description = "Upload code, config, manifests or logs and get a step-by-step fix plan from a local Ollama model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Wiebe Klijnsma" }]
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
lint = ["yamllint>=1.35", "ruff>=0.6", "hadolint-py>=2.12"]
dev = ["pytest>=8"]

[project.scripts]
fixplan = "fixplan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fixplan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixplan = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
